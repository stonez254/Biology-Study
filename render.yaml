services:
  - type: web
    name: biology-study-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biology-study-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: biology-study-db
    plan: free

# Set these in Render Dashboard. Do not commit secret values.
